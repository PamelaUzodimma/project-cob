<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>COB platform architecture</title>
<desc>Networking forms the foundation. IAM, storage, compute, database, and data platform modules compose on top, connected by module output-to-input relationships.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

<rect x="40" y="40" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Networking</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">VPC, public/private subnets, routing</text>

<rect x="60" y="170" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="190" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Identity &amp; access (IAM)</text>
<text x="190" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Least-privilege roles</text>

<rect x="340" y="170" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="470" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Object storage (S3)</text>
<text x="470" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Encrypted, versioned, TLS-only</text>

<rect x="40" y="300" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="130" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Compute (ECS)</text>
<text x="130" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Fargate service</text>

<rect x="240" y="300" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="330" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Database (RDS)</text>
<text x="330" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Secrets Manager creds</text>

<rect x="440" y="300" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Data platform</text>
<text x="530" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Glue + Athena</text>

<path d="M20 96 L20 328 L40 328" fill="none" stroke="#5F5E5A" stroke-width="0.75" marker-end="url(#arrow)"/>
<line x1="330" y1="96" x2="330" y2="300" stroke="#5F5E5A" stroke-width="0.75" marker-end="url(#arrow)"/>
<line x1="130" y1="226" x2="130" y2="300" stroke="#5F5E5A" stroke-width="0.75" marker-end="url(#arrow)"/>
<line x1="530" y1="226" x2="530" y2="300" stroke="#5F5E5A" stroke-width="0.75" marker-end="url(#arrow)"/>
<line x1="220" y1="328" x2="240" y2="328" stroke="#5F5E5A" stroke-width="0.75" marker-end="url(#arrow)"/>
</svg>
